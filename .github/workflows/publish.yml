name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Determine package version
        id: version
        run: |
          set -euo pipefail
          package_version="$(python -c $'import tomllib\nfrom pathlib import Path\npayload = tomllib.loads(Path(\"pyproject.toml\").read_text(encoding=\"utf-8\"))\nprint(payload[\"project\"][\"version\"])')"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${package_version}" >> "${GITHUB_OUTPUT}"

  publish-pypi:
    if: github.ref == 'refs/heads/main'
    needs: resolve-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check if version already exists on PyPI
        id: pypi_check
        env:
          PACKAGE_NAME: azure-pipeline-validator
          PACKAGE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          skip_publish="$(python -c $'import json\nimport os\nimport urllib.error\nimport urllib.request\n\npackage_name = os.environ[\"PACKAGE_NAME\"]\nversion = os.environ[\"PACKAGE_VERSION\"]\nurl = f\"https://pypi.org/pypi/{package_name}/json\"\n\ntry:\n    with urllib.request.urlopen(url, timeout=15) as response:\n        payload = json.load(response)\nexcept urllib.error.HTTPError as error:\n    if error.code == 404:\n        print(\"false\")\n    else:\n        raise\nelse:\n    releases = payload.get(\"releases\", {})\n    print(\"true\" if releases.get(version) else \"false\")')"
          echo "skip_publish=${skip_publish}" >> "${GITHUB_OUTPUT}"

      - name: Install uv
        if: steps.pypi_check.outputs.skip_publish != 'true'
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.10.0

      - name: Install Python 3.13
        if: steps.pypi_check.outputs.skip_publish != 'true'
        run: uv python install 3.13

      - name: Build package
        if: steps.pypi_check.outputs.skip_publish != 'true'
        run: uv build
        env:
          UV_PYTHON: python3.13

      - name: Publish package distributions to PyPI
        if: steps.pypi_check.outputs.skip_publish != 'true'
        run: uv publish --trusted-publishing always
        env:
          UV_PYTHON: python3.13

      - name: Skip publish notice
        if: steps.pypi_check.outputs.skip_publish == 'true'
        run: echo "Version already published on PyPI; skipping publish step."

  publish-ghcr-oci:
    if: github.ref == 'refs/heads/main'
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: 0.10.0

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build package
        run: uv build
        env:
          UV_PYTHON: python3.13

      - name: Compute OCI reference
        id: oci
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${owner_lc}/azure-pipeline-validator-dist:${RELEASE_TAG}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Check if OCI artifact already exists
        id: ghcr_check
        env:
          IMAGE_REF: ${{ steps.oci.outputs.image_ref }}
        run: |
          set -euo pipefail
          if oras manifest fetch "${IMAGE_REF}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Push OCI artifact with Python distributions
        if: steps.ghcr_check.outputs.exists != 'true'
        env:
          IMAGE_REF: ${{ steps.oci.outputs.image_ref }}
        run: |
          set -euo pipefail
          oras push "${IMAGE_REF}" \
            --artifact-type application/vnd.azure-pipeline-validator.dist.v1+tar \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.description=Python dist artifacts for azure-pipeline-validator" \
            dist/*

      - name: Skip GHCR publish notice
        if: steps.ghcr_check.outputs.exists == 'true'
        run: echo "GHCR artifact already exists for this tag; skipping publish step."
