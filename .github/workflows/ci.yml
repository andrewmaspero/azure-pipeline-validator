name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  semantic-pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: false
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --dev
        env:
          UV_PYTHON: python3.13

      - name: Run Ruff
        run: uv run --python 3.13 ruff check

      - name: Run Ruff Format Check
        run: uv run --python 3.13 ruff format --check

      - name: Run Pytest
        run: uv run --python 3.13 pytest -q

      - name: Run Pytest with Coverage Gate
        run: uv run --python 3.13 python -m pytest --cov=src/azure_pipelines_validator --cov-report=term-missing --cov-fail-under=90
